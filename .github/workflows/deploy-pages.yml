name: Deploy GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GUESTY_API_BASE: ${{ vars.GUESTY_API_BASE || 'https://booking-api.guesty.com' }}
      GUESTY_CLIENT_ID: ${{ secrets.GUESTY_CLIENT_ID }}
      GUESTY_CLIENT_SECRET: ${{ secrets.GUESTY_CLIENT_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve base path and site URL
        id: paths
        run: |
          # Default: project Pages path so CSS/JS load on
          # https://<user>.github.io/goldenbayholidayhomes/
          # Custom-domain cutover: set repo Variable BASE_PATH=none (empty root)
          # and NEXT_PUBLIC_SITE_URL=https://www.goldenbayholidayhomes.nz
          RAW="${{ vars.BASE_PATH }}"
          if [ "$RAW" = "none" ] || [ "$RAW" = "/" ]; then
            BASE=""
            SITE_DEFAULT="https://www.goldenbayholidayhomes.nz"
          elif [ -n "$RAW" ]; then
            BASE="$RAW"
            SITE_DEFAULT="https://gbhh-nz.github.io${BASE}"
          else
            BASE="/goldenbayholidayhomes"
            SITE_DEFAULT="https://gbhh-nz.github.io/goldenbayholidayhomes"
          fi
          SITE="${{ vars.NEXT_PUBLIC_SITE_URL }}"
          if [ -z "$SITE" ]; then SITE="$SITE_DEFAULT"; fi
          echo "base_path=$BASE" >> "$GITHUB_OUTPUT"
          echo "site_url=$SITE" >> "$GITHUB_OUTPUT"
          echo "Resolved BASE_PATH='${BASE:-<root>}' SITE_URL=$SITE"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.paths.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.paths.outputs.site_url }}
          GUESTY_CLIENT_ID: ${{ secrets.GUESTY_CLIENT_ID }}
          GUESTY_CLIENT_SECRET: ${{ secrets.GUESTY_CLIENT_SECRET }}
          GUESTY_API_BASE: ${{ vars.GUESTY_API_BASE || 'https://booking-api.guesty.com' }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
